
name: Build Voicebox macOS ARM64 DMG

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voicebox-macos-arm64-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout official latest main
        uses: actions/checkout@v4
        with:
          repository: jamiepine/voicebox
          ref: main
          path: voicebox
          persist-credentials: false

      - name: Record source revision
        working-directory: voicebox
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H %s'

      - name: Install LLVM
        run: |
          brew install llvm@20
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LLVM_CONFIG=$(brew --prefix llvm@20)/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Python dependencies
        working-directory: voicebox
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          pip install --no-deps chatterbox-tts
          pip install --no-deps hume-tada
          pip install --no-deps omnivoice
          pip install -r backend/requirements-mlx.txt
          pip install --no-deps mlx-lm==0.31.1
          pip install --no-deps mlx-audio==0.4.1

      - name: Build backend
        working-directory: voicebox
        run: |
          chmod +x scripts/build-server.sh
          ./scripts/build-server.sh

      - name: Install frontend dependencies
        working-directory: voicebox
        run: bun install

      - name: Disable updater signing for artifact build
        working-directory: voicebox
        run: |
          # Build a standalone DMG without the private updater key.
          # Do not change the upstream repository.
          jq '.bundle.createUpdaterArtifacts = false' \
            tauri/src-tauri/tauri.conf.json \
            > tauri/src-tauri/tauri.conf.json.tmp
          mv tauri/src-tauri/tauri.conf.json.tmp \
            tauri/src-tauri/tauri.conf.json

      - name: Build ARM64 DMG
        working-directory: voicebox
        env:
          CARGO_TERM_VERBOSE: "true"
          RUST_BACKTRACE: "1"
        run: |
          cd tauri
          bun run tauri build \
            --target aarch64-apple-darwin \
            --bundles dmg

      - name: Verify and stage DMG
        working-directory: voicebox
        run: |
          set -euo pipefail
          mkdir -p ../dist

          find tauri/src-tauri/target \
            -type f -name '*.dmg' \
            -exec cp {} ../dist/ \;

          test -n "$(find ../dist -maxdepth 1 \
            -type f -name '*.dmg' -print -quit)"

          echo "Source commit: $SOURCE_SHA"
          shasum -a 256 ../dist/*.dmg
          file ../dist/*.dmg
          hdiutil verify ../dist/*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-macos-arm64-${{ github.run_number }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
